management:
  endpoints:
    web:
      exposure:
        include: health, env, metrics, threaddump, heapdump, info, configprops, prometheus, loggers

logging:
  level:
    org.octopusden.octopus.teamcityautomationservice: debug

# The test TeamCity and Components Registry from the ft docker-compose.
teamcity-automation-service:
  teamcity:
    url: http://localhost:8111
    username: admin
    password: admin
  components-registry:
    url: http://localhost:4567
