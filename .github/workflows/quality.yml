# PUBLIC — static quality gates. Runs on push to main, via workflow_call (merge-gate), and manually.
name: Quality

on:
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-quality-gates.yml@v3.3.0
    with:
      java-version: '21'
      # The default coverage-command is enough: qualityCoverage covers the service modules only,
      # whose tests need no Docker. :core and :cli are excluded in octopusQuality, so their tests,
      # which start TeamCity through docker-compose, are not pulled in.
    secrets: inherit
