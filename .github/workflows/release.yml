name: Gradle Release

on:
  repository_dispatch:
    types: release

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@v3.3.0
    permissions:
      contents: write
      packages: write
    with:
      flow-type: hybrid
      java-version: '21'
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
      # The CLI and the octopus-teamcity-automation-core library go to GitHub Packages; the
      # service's :common and :client libraries go to Maven Central, and its image to ghcr.io.
      github-packages-publications: ":cli:maven,:core:maven"
      github-packages-repository: octopusden/octopus-maven-packages
      resume-deployment-id: ${{ github.event.client_payload.resume_deployment_id }}
      docker-image: teamcity-automation-service
      # ft needs TeamCity, the Components Registry and the service running in Docker or OKD.
      skip-extra-tasks: ft
      # Registered inside the release: that job needs the build and the tag, so it cannot outrun
      # the deliverables.
      register-release-immediately: true
    secrets: inherit
