name: Gradle Release

on:
  repository_dispatch:
    types: release

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@v3.0.0
    permissions:
      contents: write
      packages: write
    with:
      flow-type: hybrid
      java-version: '21'
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
      # The one publication moves in whole, so nothing is left for Central.
      publish-to-nexus: false
      github-packages-publications: ":maven"
      # With publish-to-nexus false nothing reaches Maven Central, so the artifact poll that
      # check-and-register.yml performed could never succeed and registration would never run.
      # Register inside the release instead: that job needs the build and the tag, so it still
      # cannot outrun the deliverable.
      register-release-immediately: true
    secrets: inherit
