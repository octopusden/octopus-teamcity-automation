# Rehearses a release without publishing anything.
#
# dry-run skips every step that leaves the runner — the Sonatype and Portal publishes, the
# GitHub Packages publish, the ghcr.io push, the tag, the GitHub Release and the release-log
# entry — while the Central preflight, the publication guard and the routing check (that the
# selector below names a real project with a GitHubPackages repository) still run.
#
# workflow_dispatch only surfaces workflows present on the default branch, so this file has to
# reach main before it can be run.
name: Release Smoke

on: workflow_dispatch

permissions:
  contents: read

jobs:
  smoke:
    name: release/smoke
    # Inputs mirror release.yml with dry-run added, and the commit and version taken from this
    # run rather than a repository_dispatch payload.
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@v3.3.0
    with:
      flow-type: hybrid
      java-version: '21'
      commit-hash: ${{ github.sha }}
      build-version: 0.0.0-smoke-${{ github.run_number }}
      github-packages-publications: ":cli:maven,:core:maven"
      github-packages-repository: octopusden/octopus-maven-packages
      docker-image: teamcity-automation-service
      skip-extra-tasks: ft
      dry-run: true
    secrets: inherit
