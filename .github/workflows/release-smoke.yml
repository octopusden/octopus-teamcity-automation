# Rehearses a release without publishing anything.
#
# dry-run skips every step that leaves the runner — the GitHub Packages publish, the tag,
# the GitHub Release and the release-log entry.
#
# publish-to-nexus is false here, so the Central preflight and the publication guard are
# skipped — what this rehearses is the routing check: that the selector below names a real
# project with a GitHubPackages repository. That check runs only during a release.
#
# workflow_dispatch only surfaces workflows present on the default branch, so this file has to
# reach main before it can be run.
name: Release Smoke

on: workflow_dispatch

permissions:
  contents: read

jobs:
  smoke:
    name: release/smoke
    # Inputs mirror release.yml with dry-run added, and the commit and version taken from this
    # run rather than a repository_dispatch payload.
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@v3.0.2
    with:
      flow-type: hybrid
      java-version: '21'
      commit-hash: ${{ github.sha }}
      build-version: 0.0.0-smoke-${{ github.run_number }}
      publish-to-nexus: false
      github-packages-publications: ":maven"
      github-packages-repository: octopusden/octopus-maven-packages
      dry-run: true
    secrets: inherit
