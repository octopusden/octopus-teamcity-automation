apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: teamcity-automation-service-template
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ${DEPLOYMENT_PREFIX}-tas${TAS_ID}-config-data
    data:
      application-ft.yaml: |-
        ${APPLICATION_FT_CONTENT}
  - apiVersion: v1
    kind: Pod
    metadata:
      name: ${DEPLOYMENT_PREFIX}-tas${TAS_ID}
      labels:
        app.kubernetes.io/name: ${DEPLOYMENT_PREFIX}-tas${TAS_ID}
    spec:
      restartPolicy: Never
      activeDeadlineSeconds: ${{ACTIVE_DEADLINE_SECONDS}}
      containers:
        - name: tas${TAS_ID}
          image: ${OCTOPUS_GITHUB_DOCKER_REGISTRY}/octopusden/teamcity-automation-service:${TEAMCITY_AUTOMATION_SERVICE_VERSION}
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 400Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Liveness, not readiness: the readiness group includes TeamCity, and the instance with a wrong
          # account must still become ready so that the ft can see its readiness answer DOWN.
          readinessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "/"
            - name: SPRING_PROFILES_ACTIVE
              value: "ft"
            - name: SPRING_CLOUD_CONFIG_ENABLED
              value: "false"
            - name: TEAMCITY_URL
              value: ${TAS_TEAMCITY_URL}
            - name: TEAMCITY_USERNAME
              value: ${TAS_TEAMCITY_USERNAME}
            - name: TEAMCITY_PASSWORD
              value: ${TAS_TEAMCITY_PASSWORD}
            - name: COMPONENTSREGISTRY_URL
              value: ${TAS_COMPONENTS_REGISTRY_URL}
          volumeMounts:
            - name: application-ft
              mountPath: /application-ft.yaml
              subPath: application-ft.yaml
              readOnly: true
      volumes:
        - name: application-ft
          configMap:
            name: ${DEPLOYMENT_PREFIX}-tas${TAS_ID}-config-data
            items:
              - key: application-ft.yaml
                path: application-ft.yaml
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${DEPLOYMENT_PREFIX}-tas${TAS_ID}-service
    spec:
      ports:
        - port: 8080
          protocol: TCP
          targetPort: 8080
      selector:
        app.kubernetes.io/name: ${DEPLOYMENT_PREFIX}-tas${TAS_ID}
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${DEPLOYMENT_PREFIX}-tas${TAS_ID}-route
      annotations:
        # A chain makes a few dozen TeamCity calls; keep the route from cutting a slow one off.
        haproxy.router.openshift.io/timeout: 240s
    spec:
      port:
        targetPort: 8080
      to:
        kind: Service
        name: ${DEPLOYMENT_PREFIX}-tas${TAS_ID}-service
parameters:
  - description: Unique deployment prefix
    name: DEPLOYMENT_PREFIX
    required: true
  - description: Active deadline seconds
    name: ACTIVE_DEADLINE_SECONDS
    required: true
  - description: Docker registry
    name: DOCKER_REGISTRY
    required: true
  - description: Octopus github docker registry
    name: OCTOPUS_GITHUB_DOCKER_REGISTRY
    required: true
  - description: Teamcity automation service version
    name: TEAMCITY_AUTOMATION_SERVICE_VERSION
    required: true
  - description: application-ft.yaml content
    name: APPLICATION_FT_CONTENT
    required: true
  - description: Id of this service instance (one per TeamCity), part of the object names
    name: TAS_ID
    required: true
  - description: TeamCity base URL the service works with
    name: TAS_TEAMCITY_URL
    required: true
  - description: TeamCity account the service works as
    name: TAS_TEAMCITY_USERNAME
    required: true
  - description: Password of the TeamCity account
    name: TAS_TEAMCITY_PASSWORD
    required: true
  - description: Components Registry base URL the service reads from
    name: TAS_COMPONENTS_REGISTRY_URL
    required: true
